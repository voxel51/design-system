name: run unit tests

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to use
        type: string
        required: true
      ref:
        description: Git ref to check out (branch, tag, or SHA)
        type: string
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm run test
