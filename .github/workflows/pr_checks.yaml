on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  run_tests:
    name: run unit tests
    uses: ./.github/workflows/_run_tests.yaml
    with:
      node-version: 22.22.0

  build_storybook:
    name: build storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

  # Required check: every component has a story, a page object, and a
  # page-object spec that agree with each other (utils/check-component-alignment.ts),
  # and each page object drives every story of its component under Playwright.
  component_alignment:
    name: component alignment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm ci

      - name: Check component alignment
        run: npm run check:alignment

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run page-object specs
        run: npm run test:pom

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
