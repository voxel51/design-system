name: Publish Storybook to Chromatic

# Publishes three Storybook builds per push:
#   - combined (v1 + v2 + comparisons) — the link to share for review
#   - v1 only, v2 only — so each version has a stable URL to diff against
#
# Chromatic's visual regression compares a build against the previous build of
# the *same* project, so the per-version projects are what make "did v2 change"
# answerable. The combined build is for humans browsing both at once.
#
# Setup — one Chromatic project per build, one repository secret each:
#
#   1. At chromatic.com, sign in with GitHub and add the `voxel51/design-system`
#      repository three times, as three projects: `design-system` (combined),
#      `design-system-v1`, `design-system-v2`. Each gets its own project token.
#   2. Store each token as a repository secret, so the value never lands in a
#      shell history or a file:
#
#        gh secret set CHROMATIC_TOKEN_COMBINED --repo voxel51/design-system
#        gh secret set CHROMATIC_TOKEN_V1       --repo voxel51/design-system
#        gh secret set CHROMATIC_TOKEN_V2       --repo voxel51/design-system
#
#      Each prompts for the value on stdin.
#
# A leg whose secret is missing is skipped rather than failed, so one token is
# enough to get a hosted link — add the other two when per-version diffing
# starts to matter.
#
# To publish by hand instead, without touching CI:
#
#   yarn generate-tailwind-theme
#   VOODO_VERSION=all yarn build-storybook -o storybook-static/combined
#   CHROMATIC_PROJECT_TOKEN=… yarn chromatic:combined

on:
  push:
    branches: [shadcn-poc]
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    # The token is resolved once, here, because `secrets` is not an available
    # context in a step-level `if` — referencing it there is a workflow file
    # error and the run dies in 0s before any step executes. `env` *is*
    # available, so the skip condition tests this instead.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets[matrix.secret] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: combined
            version: all
            secret: CHROMATIC_TOKEN_COMBINED
          - name: v1
            version: "1"
            secret: CHROMATIC_TOKEN_V1
          - name: v2
            version: "2"
            secret: CHROMATIC_TOKEN_V2
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic uses git history to find the previous build to compare
          # against; a shallow clone makes every build look like the first one.
          fetch-depth: 0

      # Before setup-node, not after. Its `cache: yarn` shells out to
      # `yarn cache dir`, and the runner's global yarn is 1.22, which refuses
      # any repo pinned via `packageManager` — "the current global version of
      # Yarn is 1.22.22" — so the step fails before installing anything.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      # v1's theme is generated from the token source, and yarn 4 does not run
      # `pre*` script hooks, so this cannot be left to `prestorybook`.
      - run: yarn generate-tailwind-theme

      - run: yarn build-storybook -o storybook-static/${{ matrix.name }}
        env:
          VOODO_VERSION: ${{ matrix.version }}

      # The `chromatic` script is a bare passthrough on purpose. It used to
      # carry these same flags, and passing them here too failed every run with
      # "The flag --exitZeroOnChanges can only be set once."
      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: yarn chromatic --storybook-build-dir storybook-static/${{ matrix.name }} --exit-zero-on-changes

      - name: No token for this build
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: |
          echo "::notice::${{ matrix.secret }} is not set — built ${{ matrix.name }} but did not publish it."
          echo "Add the secret to publish this build. See the header of this workflow."
