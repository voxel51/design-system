name: publish package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_test_and_publish.yaml
    with:
      node-version: 20
      registry-url: https://us-central1-npm.pkg.dev/computer-vision-team/dev-js/
    secrets:
      REGISTRY_TOKEN: ${{ secrets.NPM_TOKEN }}
